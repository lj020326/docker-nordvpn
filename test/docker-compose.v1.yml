
networks:
  net:
    attachable: true
    ipam:
      config:
        - subnet: 192.168.10.0/24

  socket_proxy:
    attachable: true
    ipam:
      config:
        - subnet: 192.168.11.0/24

  traefik_public:
    external: true
  vpn:
    external: true

volumes:
  model-cache: {}




services:
  ########################
  ## BASE GROUP SERVICES
  traefik:
    image: traefik:v3.6.1
    container_name: traefik
    restart: unless-stopped
    environment:
      ## app envs
      PGID: '895'
      PUID: '1003'
      TZ: America/New_York
    networks:
      - traefik_public
    ports:
      - mode: host
        protocol: tcp
        published: 80
        target: 80
      - mode: host
        protocol: tcp
        published: 443
        target: 443
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.routers.http-catchall.entrypoints=http
      - traefik.http.routers.http-catchall.middlewares=redirect-to-https
      - traefik.http.routers.http-catchall.rule=HostRegexp(`{host:.+}`)
      - traefik.http.routers.ping.entrypoints=https
      - traefik.http.routers.ping.rule=Host(`traefik.media.johnson.int`) && PathPrefix(`/ping`)
      - traefik.http.routers.ping.service=ping@internal
      - traefik.http.routers.traefik-rtr.service=api@internal
      - traefik.http.routers.traefik-rtr.entrypoints=https
      - traefik.http.routers.traefik-rtr.rule=Host(`traefik.media.johnson.int`)
      - traefik.http.services.api.loadbalancer.server.port=8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/media/docker/traefik:/etc/traefik
      - /home/media/docker/traefik/certs:/certs
      - /home/media/docker/shared:/shared

  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: socket-proxy
    restart: always
    privileged: true
    environment:
      ## app envs
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      CONTAINERS: 1
      CONTAINERS_CREATE: 1
      CONTAINERS_DELETE: 1
      CONTAINERS_START: 1
      CONTAINERS_UPDATE: 1
      DELETE: 1
      DISTRIBUTION: 0
      EVENTS: 1
      EXEC: 0
      IMAGES: 1
      IMAGES_DELETE: 1
      INFO: 1
      LOG_LEVEL: debug
      NETWORKS: 1
      NODES: 0
      PING: 1
      PLUGINS: 0
      POST: 1
      SECRETS: 0
      SERVICES: 1
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 1
      VERSION: 1
      VOLUMES: 1
    networks:
      - socket_proxy
    ports:
      - 2375:2375
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  whoami:
    image: containous/whoami
    container_name: whoami
    networks:
      - traefik_public
    ports:
      - protocol: tcp
        published: 9080
        target: 80
    labels:
      - traefik.enable=true
      - traefik.http.routers.whoami.entrypoints=https
      - traefik.http.routers.whoami.rule=Host(`whoami.media.dettonville.cloud`,`whoami.media.johnson.int`)
      - traefik.http.services.whoami.loadbalancer.server.port=80

  portainer-agent:
    image: portainer/agent:latest
    container_name: portainer-agent
    networks:
      - socket_proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes

  portainer:
    image: portainer/portainer-ce:sts
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    environment:
      ## app envs
      TZ: America/New_York
    networks:
      - traefik_public
      - socket_proxy
    ports:
      - mode: host
        protocol: tcp
        published: 9010
        target: 9000
    command: >-
      -H tcp://tasks.portainer-agent:9001 --tlsskipverify
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer-rtr.entrypoints=https
      - traefik.http.routers.portainer-rtr.rule=Host(`portainer.media.johnson.int`)
      - traefik.http.routers.portainer-rtr.service=portainer-svc
      - traefik.http.services.portainer-svc.loadbalancer.server.port=9000
    volumes:
      - /etc/localtime:/etc/localtime
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /home/media/docker/portainer/data:/data

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    environment:
      ## app envs
      DOCKER_HOST: tcp://socket-proxy:2375
      DOZZLE_FILTER: status=running
      DOZZLE_LEVEL: info
    networks:
      - traefik_public
      - socket_proxy
    ports:
      - mode: host
        protocol: tcp
        published: 8080
        target: 8080
    labels:
      - traefik.enable=true
      - traefik.http.routers.dozzle-rtr.entrypoints=https
      - traefik.http.routers.dozzle-rtr.rule=Host(`dozzle.media.johnson.int`)
      - traefik.http.routers.dozzle-rtr.service=dozzle-svc
      - traefik.http.services.dozzle-svc.loadbalancer.server.port=8080

  openvpn:
    image: media.johnson.int:5000/docker-nordvpn:v1
    container_name: openvpn
    restart: unless-stopped
    environment:
      ## app envs
      CATEGORY: P2P
      COUNTRY: United_States
      ## include the traefik_public subnet (192.168.12.0/24) in allowed networks
      NETWORK: "192.168.12.0/24;192.168.13.0/24"
      OPENVPN_OPTS: --pull-filter ignore "ping-restart" --ping-exit 180
#      OPENVPN_OPTS: --mute-replay-warnings --ping-exit 60
      PASS: passw0rd123
      RANDOM_TOP: 10
      RECREATE_VPN_CRON: 5 */3 * * *
      TZ: America/New_York
      USER: username123
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    networks:
      - vpn
      - traefik_public
    ports:
      - 8168:8168
    dns:
      - 8.8.4.4
      - 8.8.8.8


  downloader:
    image: ghcr.io/linuxserver/downloader:latest
    container_name: downloader
    network_mode: service:openvpn
    restart: always
    environment:
      ## app envs
      PGID: '895'
      PUID: '1003'
      TZ: America/New_York
      WEBUI_PORT: 8168
#    networks:
#      - traefik_public
    depends_on:
      - openvpn
    labels:
      - traefik.enable=true
#      - traefik.docker.network=traefik_public
      - traefik.http.routers.downloader.entrypoints=https
      - traefik.http.routers.downloader.rule=Host(`downloads.media.johnson.int`)
      - traefik.http.services.downloader.loadbalancer.server.port=8168
    volumes:
      - /home/media/docker/downloader:/config
      - /export/media/downloads:/downloads
